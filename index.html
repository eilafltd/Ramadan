<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUA Alliance | Ramadan Mubarak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --ice-blue: #A5F3FC; }
        body { margin: 0; overflow-x: hidden; font-family: 'Poppins', 'Cairo', sans-serif; transition: background-color 0.5s ease; }
        .canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; outline: none; }
        .ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark-mode { background-color: #020617; color: #f8fafc; }
        .light-mode { background-color: #f1f5f9; color: #1e293b; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        .ramadan-glow { text-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="dark-mode">

    <div id="webgl-canvas" class="canvas-container"></div>

    <div class="ui-layer min-h-screen flex flex-col">
        <nav class="p-6 flex justify-between items-center w-full">
            <div class="interactive group cursor-pointer">
                <h1 class="text-3xl font-black tracking-widest text-white group-hover:text-yellow-400 transition-colors">
                    FUA <span class="text-yellow-500">ALLIANCE</span>
                </h1>
                <p class="text-[10px] uppercase tracking-[0.3em] opacity-70">Family United All</p>
            </div>
            
            <div class="flex items-center gap-4 interactive">
                <button onclick="toggleLang()" class="glass-morphism px-4 py-2 rounded-full text-sm font-bold border-yellow-500/50 hover:bg-yellow-500/20 transition-all" id="lang-btn">
                    العربية
                </button>
                <button onclick="toggleTheme()" class="glass-morphism p-3 rounded-full hover:rotate-12 transition-transform" id="theme-btn">
                    🌙
                </button>
            </div>
        </nav>

        <div class="flex-grow flex flex-col items-center justify-center text-center px-4">
            <div class="mb-12 floating">
                <h2 id="main-title" class="text-5xl md:text-7xl font-extrabold mb-4 ramadan-glow">Ramadan Kareem</h2>
                <p id="sub-title" class="text-lg md:text-xl opacity-80 max-w-2xl italic">
                    "United by loyalty, strengthened by faith."
                </p>
            </div>

            <div class="mt-[300px] interactive">
                <p id="tap-hint" class="text-yellow-500 animate-bounce font-bold uppercase tracking-widest text-sm">
                    Click the Mystery Box
                </p>
            </div>
        </div>

        <footer class="p-8 text-center text-xs opacity-40 uppercase tracking-widest">
            FUA Family • Whiteout Survival
        </footer>
    </div>

    <!-- Message Modal -->
    <div id="message-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-500 interactive">
        <div class="glass-morphism p-10 rounded-3xl max-w-md w-full text-center relative border-2 border-yellow-500/30">
            <div class="text-5xl mb-4">🌙</div>
            <h3 id="modal-title" class="text-2xl font-black text-yellow-500 mb-6 uppercase tracking-wider">Ramadan Message</h3>
            <p id="modal-body" class="text-xl leading-relaxed mb-8 font-medium">
                <!-- Random message will appear here -->
            </p>
            <button onclick="closeModal()" id="close-btn" class="w-full bg-yellow-500 text-black py-4 rounded-2xl font-black hover:bg-yellow-400 transition-all shadow-[0_0_20px_rgba(234,179,8,0.4)]">
                CONTINUE
            </button>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let isDarkMode = true;
        let isBoxOpen = false;

        // --- Multi-Message Database ---
        const messages = {
            en: [
                "The FUA Alliance wishes you a blessed month filled with peace and legendary victories.",
                "Stay warm in the snow, and stay strong in your faith. Ramadan Mubarak, warrior!",
                "Family United All: Together we survive the cold, together we celebrate the blessings.",
                "May your furnace always burn bright and your heart always find peace this Ramadan.",
                "To our heroes: May your generosity shine as bright as the northern lights.",
                "Strength isn't just in numbers, it's in the bonds we share. Happy Ramadan!",
                "May your shield never break and your fast be easy. FUA stands with you."
            ],
            ar: [
                "تحالف FUA يتمنى لكم شهراً مباركاً مليئاً بالسكينة والانتصارات الأسطورية.",
                "ابقَ دافئاً في الجليد، وقوياً في إيمانك. رمضان مبارك يا محارب!",
                "عائلة واحدة: معاً ننجو من البرد، ومعاً نحتفل بالبركات.",
                "ليكن موقدك مشتعلاً دائماً، وقلبك مطمئناً في هذا الشهر الفضيل.",
                "إلى أبطالنا: ليت كرمكم يضيء كأضواء الشفق القطبي في سمائنا.",
                "القوة ليست في العدد فقط، بل في الروابط التي تجمعنا. رمضان كريم!",
                "أتمنى أن لا ينكسر درعك أبداً، وأن يكون صيامك ميسراً. FUA دائماً بجانبك."
            ]
        };

        const translations = {
            en: {
                mainTitle: "Ramadan Kareem",
                subTitle: "\"United by loyalty, strengthened by faith.\"",
                tapHint: "Click the Mystery Box",
                langBtn: "العربية",
                modalTitle: "Alliance Wisdom",
                closeBtn: "CONTINUE"
            },
            ar: {
                mainTitle: "رمضان كريم",
                subTitle: "\"متحدون بالولاء، أقوياء بالإيمان.\"",
                tapHint: "اضغط على صندوق المفاجآت",
                langBtn: "English",
                modalTitle: "حكمة التحالف",
                closeBtn: "استمرار"
            }
        };

        // --- Three.js setup ---
        let scene, camera, renderer, boxGroup, lid, boxBase, stars;
        
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('webgl-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffd700, 2, 20);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            boxGroup = new THREE.Group();
            
            // Box Base
            const baseGeo = new THREE.BoxGeometry(2, 1.8, 2);
            const baseMat = new THREE.MeshStandardMaterial({ 
                color: 0x1e293b, 
                metalness: 0.8, 
                roughness: 0.2,
                emissive: 0x0ea5e9,
                emissiveIntensity: 0.05
            });
            boxBase = new THREE.Mesh(baseGeo, baseMat);
            boxGroup.add(boxBase);

            // Lid
            const lidGeo = new THREE.BoxGeometry(2.3, 0.5, 2.3);
            const lidMat = new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.9, roughness: 0.1 });
            lid = new THREE.Mesh(lidGeo, lidMat);
            lid.position.y = 1.1;
            boxGroup.add(lid);

            // Cross Ribbon
            const ribMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.85, 2.1), ribMat);
            const r2 = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.85, 0.4), ribMat);
            boxBase.add(r1, r2);

            boxGroup.position.y = -1;
            scene.add(boxGroup);

            // Snow Particles
            const starGeo = new THREE.BufferGeometry();
            const posArray = new Float32Array(2000 * 3);
            for(let i=0; i<6000; i++) posArray[i] = (Math.random() - 0.5) * 20;
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.03, color: 0xffffff, transparent: true, opacity: 0.8 }));
            scene.add(stars);

            camera.position.z = 5;
            camera.position.y = 0.5;
        }

        function animate() {
            requestAnimationFrame(animate);
            boxGroup.rotation.y += 0.005;
            stars.rotation.y += 0.001;
            stars.position.y -= 0.005;
            if(stars.position.y < -5) stars.position.y = 5;
            renderer.render(scene, camera);
        }

        // --- Interaction Logic ---
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const dict = translations[currentLang];
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;
            
            document.getElementById('main-title').innerText = dict.mainTitle;
            document.getElementById('sub-title').innerText = dict.subTitle;
            document.getElementById('tap-hint').innerText = dict.tapHint;
            document.getElementById('lang-btn').innerText = dict.langBtn;
            document.getElementById('modal-title').innerText = dict.modalTitle;
            document.getElementById('close-btn').innerText = dict.closeBtn;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.className = isDarkMode ? 'dark-mode' : 'light-mode';
            document.getElementById('theme-btn').innerText = isDarkMode ? '🌙' : '☀️';
            const targetColor = isDarkMode ? 0x1e293b : 0x60a5fa;
            gsap.to(boxBase.material.color, { 
                r: ((targetColor >> 16) & 255) / 255, 
                g: ((targetColor >> 8) & 255) / 255, 
                b: (targetColor & 255) / 255, 
                duration: 1 
            });
        }

        function openBox() {
            if(isBoxOpen) return;
            isBoxOpen = true;

            // Pick a random message
            const currentMessages = messages[currentLang];
            const randomMsg = currentMessages[Math.floor(Math.random() * currentMessages.length)];
            document.getElementById('modal-body').innerText = randomMsg;

            // Animations
            gsap.to(lid.position, { y: 3.5, duration: 0.8, ease: "back.out(1.7)" });
            gsap.to(lid.rotation, { x: 1.2, z: 0.8, duration: 1 });
            gsap.to(boxGroup.scale, { x: 1.3, y: 1.3, z: 1.3, duration: 0.3, yoyo: true, repeat: 1 });

            setTimeout(() => {
                const modal = document.getElementById('message-modal');
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('opacity-100'), 50);
            }, 600);
        }

        function closeModal() {
            const modal = document.getElementById('message-modal');
            modal.classList.remove('opacity-100');
            setTimeout(() => {
                modal.classList.add('hidden');
                gsap.to(lid.position, { y: 1.1, duration: 1, ease: "bounce.out" });
                gsap.to(lid.rotation, { x: 0, z: 0, duration: 1 });
                isBoxOpen = false;
            }, 500);
        }

        // Raycasting for 3D interactions
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boxGroup.children);
            if (intersects.length > 0) openBox();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initThree();
        animate();
    </script>
</body>
</html>
